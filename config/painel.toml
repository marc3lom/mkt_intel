[[painel.ativo]]
ticker = "Z 1 Index"
rotulo = "Futuro FTSE 100"
rotulo_grade = "FTSE 100 Fut"
tipo = "acao"
coluna = 2

[[painel.ativo]]
ticker = "NK1 Index"
rotulo = "Futuro Nikkei 225"
rotulo_grade = "Nikkei 225 Fut"
tipo = "acao"
coluna = 2

[[painel.ativo]]
ticker = "IFB1 Index"
rotulo = "Futuro CSI 300"
rotulo_grade = "CSI 300 Fut"
