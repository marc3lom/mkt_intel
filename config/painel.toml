coluna = 2

# =========================== Coluna 3 — Moedas ==============================
[[painel.ativo]]
ticker = "DXY Curncy"
rotulo = "DXY"
rotulo_grade = "DXY"
tipo = "cambio"
coluna = 3

# "EUR" e "GBP" sem barra são inequívocos: as duas cotações sobem quando a moeda
# europeia se fortalece contra o dólar.
[[painel.ativo]]
ticker = "EURUSD Curncy"
rotulo = "EUR"
rotulo_grade = "EUR"
tipo = "cambio"
coluna = 3

[[painel.ativo]]
ticker = "GBPUSD Curncy"
rotulo = "GBP"
rotulo_grade = "GBP"
tipo = "cambio"
coluna = 3

# Estes dois são o oposto: o par é USD/XXX, e quando sobe é a moeda asiática que
# ENFRAQUECE. O rótulo precisa dizer o par, sob pena de o texto direcional
# afirmar o contrário do dado.
[[painel.ativo]]
ticker = "USDJPY Curncy"
rotulo = "USD/JPY"
rotulo_grade = "USD/JPY"
tipo = "cambio"
coluna = 3

[[painel.ativo]]
ticker = "USDCNH Curncy"
rotulo = "USD/CNH"
rotulo_grade = "USD/CNH"
tipo = "cambio"
coluna = 3

