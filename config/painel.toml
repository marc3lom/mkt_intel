# Índice de commodities da Bloomberg. As barras intradiárias começam às 02h00
# UTC — 23h do dia anterior em Brasília — então na janela do plantão o gráfico
# já está formado, ao contrário do OVX, que só abre às 10h30.
[[painel.ativo]]
ticker = "BCOM Index"
rotulo = "BCOM (commodities)"
rotulo_grade = "BCOM"
tipo = "indice"
coluna = 4