[project]
name = "comentario-matinal"
version = "0.1.0"
description = "Utilitários do Comentário Matinal da Mesa de Investimentos (DEPIN/DIRIN)"
readme = "README.md"
authors = [
    { name = "Marcelo Martinelli", email = "mmartinelli@gmail.com" }
]
# O piso vem do pacote `daily`, que exige 3.14. Ele é dependência daqui, então
# este projeto não pode pedir menos.
requires-python = ">=3.14"
dependencies = [
    "daily",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "xbbg>=1.4",
    "blpapi>=3.24",
    "python-docx>=1.2.0",
    "pypdf>=6.16.1",
]

# A camada de renderização (grade do painel, tabelas do calendário, detecção de
# feriado) vive no repositório `daily` e é compartilhada, não copiada: ela tem
# outros consumidores lá — os notebooks de `drafts/` e o `tests/test_render.py`.
# Duplicar aqui criaria duas cópias divergindo com o tempo, que é a versão
# estrutural do problema que este comando existe para resolver.
[tool.uv.sources]
daily = { path = "../daily", editable = true }
blpapi = { index = "bloomberg" }

# blpapi não é publicado no PyPI. Vem do índice da própria Bloomberg, declarado
# como explicit para que nenhuma outra dependência seja resolvida a partir dele.
[[tool.uv.index]]
name = "bloomberg"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"
explicit = true

[project.scripts]
matinal = "comentario_matinal.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "comentario_matinal"

[dependency-groups]
dev = [
    "pytest>=9.1",
]
