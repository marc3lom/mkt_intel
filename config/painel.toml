# Configuração do painel de mercado.
#
# Este arquivo é a fonte canônica dos ativos: a mesma lista alimenta a imagem
# enviada à diretoria e o bloco direcional em texto usado na checagem do
# comentário. Não há segunda lista em lugar nenhum — é o que impede a imagem e o
# texto de divergirem.
#
# Conferir todos os tickers no terminal antes do primeiro uso em produção.

[painel]
# Limiar em pontos percentuais abaixo do qual o movimento de um ativo de PREÇO é
# reportado como "estável" em vez de direcional. Evita narrar ruído como movimento.
limiar_estabilidade = 0.25

# Limiar equivalente para ativos de TAXA, em pontos percentuais da própria taxa
# (0.01 = 1 bp).
limiar_estabilidade_taxa = 0.01

# Grade do painel, [linhas, colunas].
grade = [5, 4]

# Cabeçalho de cada coluna da imagem, na ordem das colunas. Um por coluna.
titulos_colunas = ["Yields Soberanos", "Índices Ações", "Moedas", "Outros"]

# Cada ativo declara a COLUNA da grade a que pertence, uma categoria por coluna:
#
#   1 Yields Soberanos | 2 Índices Ações | 3 Moedas | 4 Outros
#
# Dentro da coluna, a ordem do arquivo é a ordem de cima para baixo. As colunas
# não precisam ter o mesmo tamanho; hoje as quatro têm cinco ativos e preenchem
# a grade exatamente. Se alguma encurtar, ela precisa ser a última — ver
# Config.ordem_da_grade.
#
# O matplotlib numera os subplots por linha, então o código transpõe (ver
# Config.ordem_da_grade). Declarar a coluna em vez de inferi-la por altura fixa é
# deliberado: com colunas de tamanhos diferentes, inferir colocaria os ativos nas
# células erradas sem reclamar.
#
# Esta é também a ordem em que o bloco direcional em texto lista os ativos, de
# modo que cada grupo do texto corresponde a uma coluna da imagem.
#
# tipo: "taxa" | "acao" | "indice" | "cambio" | "commodity" | "vol"
#   taxa      — variação reportada em direção da TAXA e formatada em bps
#   vol       — convenção invertida: queda de volatilidade conta como positiva
#   indice    — nível de índice, sem prefixo de moeda
#   os demais — variação reportada em direção do PREÇO
#
# rotulo       — usado no bloco direcional em texto; precisa ser inequívoco
# rotulo_grade — usado no tile da imagem, onde o espaço é curto

# =========================== Coluna 1 — Yields Soberanos ====================
[[painel.ativo]]
ticker = "USGG10YR Index"
rotulo = "Treasury 10a"
rotulo_grade = "Treasury 10a"
tipo = "taxa"
coluna = 1

[[painel.ativo]]
ticker = "GDBR10 Index"
rotulo = "Bund 10a"
rotulo_grade = "Bund 10a"
tipo = "taxa"
coluna = 1

[[painel.ativo]]
ticker = "GUKG10 Index"
rotulo = "Gilt 10a"
rotulo_grade = "Gilt 10a"
tipo = "taxa"
coluna = 1

# GJGB10 é o índice de taxa do JGB, e não o título em preço: devolve a taxa
# direto, com variação líquida válida. O ticker de título exigiria uma consulta
# extra de yield para chegar no mesmo número.
[[painel.ativo]]
ticker = "GJGB10 Index"
rotulo = "JGB 10a"
rotulo_grade = "JGB 10a"
tipo = "taxa"
coluna = 1

[[painel.ativo]]
ticker = "GCNY10YR Index"
rotulo = "CGB 10a"
rotulo_grade = "CGB 10a"
tipo = "taxa"
coluna = 1

# =========================== Coluna 2 — Índices Ações =======================
[[painel.ativo]]
ticker = "ES1 Index"
rotulo = "Futuro S&P 500"
rotulo_grade = "S&P 500 Fut"
tipo = "acao"
coluna = 2

[[painel.ativo]]
ticker = "VG1 Index"
rotulo = "Futuro EuroStoxx 50"
rotulo_grade = "Stoxx50 Fut"
tipo = "acao"
coluna = 2

# Genérico de primeiro vencimento do futuro de FTSE 100, na ICE Futures Europe.
