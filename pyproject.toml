[project]
name = "comentario-matinal"
version = "0.1.0"
description = "Utilitários do Comentário Matinal da Mesa de Investimentos (DEPIN/DIRIN)"
readme = "README.md"
authors = [
    { name = "Marcelo Martinelli", email = "mmartinelli@gmail.com" }
]
# O piso de 3.14 é o mesmo que a camada de renderização absorvida exigia.
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10",
    "pandas>=2.2",
    "numpy>=2.0",
    "xbbg>=1.4",
    "blpapi>=3.24",
    "polars-bloomberg>=0.5.4",
    "pandas-market-calendars>=5.4.0",
    "python-docx>=1.2.0",
    "pypdf>=6.16.1",
    "cryptography>=50.0.0",
]

[tool.uv.sources]
blpapi = { index = "bloomberg" }

# blpapi não é publicado no PyPI. Vem do índice da própria Bloomberg, declarado
# como explicit para que nenhuma outra dependência seja resolvida a partir dele.
[[tool.uv.index]]
name = "bloomberg"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"
explicit = true

[project.scripts]
matinal = "comentario_matinal.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "comentario_matinal"

[dependency-groups]
dev = [
    "pytest>=9.1",
]
